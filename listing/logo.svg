<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" preserveAspectRatio="xMidYMid meet" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f7f9"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252423"/>
      <stop offset="100%" stop-color="#1a1918"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Calendar body -->
  <g filter="url(#shadow)">
    <!-- Binding loops protruding above -->
    <rect x="60" y="14" width="10" height="22" rx="4" fill="#252423"/>
    <rect x="146" y="14" width="10" height="22" rx="4" fill="#252423"/>

    <!-- Card -->
    <rect x="22" y="28" width="172" height="172" rx="22" fill="url(#bg)" stroke="#e5e3e1" stroke-width="1.5"/>

    <!-- Header strip -->
    <path d="M 22 50 Q 22 28 44 28 L 172 28 Q 194 28 194 50 L 194 78 L 22 78 Z" fill="url(#header)"/>

    <!-- "CP" in header -->
    <text x="108" y="64" font-family="Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#F2C811" text-anchor="middle" letter-spacing="2">CP</text>

    <!-- Date range visualization -->
    <g transform="translate(108, 130)">
      <!-- Track line -->
      <line x1="-58" y1="0" x2="58" y2="0" stroke="#d2d0ce" stroke-width="3" stroke-linecap="round"/>
      <!-- Emerald active range -->
      <line x1="-50" y1="0" x2="50" y2="0" stroke="url(#emerald)" stroke-width="5" stroke-linecap="round"/>
      <!-- Start dot -->
      <circle cx="-50" cy="0" r="11" fill="#ffffff" stroke="#10B981" stroke-width="3.5"/>
      <!-- End dot -->
      <circle cx="50" cy="0" r="11" fill="#10B981" stroke="#059669" stroke-width="2"/>
    </g>

    <!-- Day numbers below -->
    <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#252423" text-anchor="middle">
      <text x="58" y="170">1</text>
      <text x="158" y="170">31</text>
    </g>

    <!-- Bottom label -->
    <text x="108" y="193" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#605e5c" text-anchor="middle" letter-spacing="2">CALENDAR PRO</text>
  </g>
</svg>
