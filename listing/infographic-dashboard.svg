<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="emeraldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="emeraldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle dot pattern -->
  <g opacity="0.04" fill="#252423">
    <g><circle cx="40" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/><circle cx="200" cy="40" r="1.5"/><circle cx="280" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="440" cy="40" r="1.5"/><circle cx="520" cy="40" r="1.5"/><circle cx="600" cy="40" r="1.5"/><circle cx="680" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/><circle cx="840" cy="40" r="1.5"/><circle cx="920" cy="40" r="1.5"/><circle cx="1000" cy="40" r="1.5"/><circle cx="1080" cy="40" r="1.5"/><circle cx="1160" cy="40" r="1.5"/><circle cx="1240" cy="40" r="1.5"/></g>
  </g>

  <!-- ========================================================== -->
  <!-- Header -->
  <!-- ========================================================== -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-size="38" font-weight="700" fill="#252423">Drives Your Whole Report</text>
    <text x="0" y="30" font-size="16" font-weight="400" fill="#605e5c">One date range — all visuals update. Powered by Calendar Pro.</text>
  </g>

  <!-- Power BI badge top-right -->
  <g transform="translate(1100, 50)">
    <rect x="-20" y="-25" width="130" height="40" rx="20" fill="#252423"/>
    <circle cx="0" cy="-5" r="8" fill="#F2C811"/>
    <text x="14" y="0" font-size="13" font-weight="600" fill="#ffffff">Power BI Visual</text>
  </g>

  <!-- ========================================================== -->
  <!-- TOP ROW: Calendar Pro centerpiece (left) + KPI cards (right) -->
  <!-- ========================================================== -->

  <!-- Calendar Pro panel -->
  <g transform="translate(60, 120)" filter="url(#shadowLg)">
    <rect x="0" y="0" width="420" height="180" rx="12" fill="url(#card)" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="6" rx="3" fill="url(#emeraldH)"/>

    <text x="20" y="34" font-size="13" font-weight="600" fill="#10B981" letter-spacing="1">▼ DATE RANGE FILTER</text>
    <text x="20" y="56" font-size="14" font-weight="700" fill="#252423">Calendar Pro Date Selector</text>

    <!-- Date inputs -->
    <g transform="translate(20, 76)">
      <!-- Start -->
      <rect x="0" y="0" width="140" height="36" rx="6" fill="#ffffff" stroke="#10B981" stroke-width="2"/>
      <text x="14" y="22" font-size="15" font-weight="500" fill="#252423">01/01/2026</text>
      <rect x="110" y="9" width="18" height="18" rx="2" fill="none" stroke="#10B981" stroke-width="1.5"/>
      <line x1="110" y1="14" x2="128" y2="14" stroke="#10B981" stroke-width="1.5"/>

      <!-- Arrow -->
      <line x1="152" y1="18" x2="190" y2="18" stroke="#10B981" stroke-width="3"/>
      <polygon points="190,18 182,14 182,22" fill="#10B981"/>

      <!-- End -->
      <rect x="202" y="0" width="140" height="36" rx="6" fill="#ffffff" stroke="#10B981" stroke-width="2"/>
      <text x="216" y="22" font-size="15" font-weight="500" fill="#252423">03/31/2026</text>
      <rect x="312" y="9" width="18" height="18" rx="2" fill="none" stroke="#10B981" stroke-width="1.5"/>
      <line x1="312" y1="14" x2="330" y2="14" stroke="#10B981" stroke-width="1.5"/>
    </g>

    <!-- Navigation arrows -->
    <g transform="translate(110, 138)" fill="#605e5c">
      <text x="0" y="0" font-size="20" font-weight="600">«</text>
      <text x="32" y="0" font-size="20" font-weight="600">‹</text>
      <circle cx="86" cy="-8" r="5" fill="#10B981"/>
      <text x="124" y="0" font-size="20" font-weight="600">›</text>
      <text x="156" y="0" font-size="20" font-weight="600">»</text>
    </g>

    <!-- D W M Q Y indicator -->
    <g transform="translate(280, 122)">
      <rect x="0" y="0" width="120" height="28" rx="14" fill="#f3f4f6"/>
      <rect x="0" y="0" width="48" height="28" rx="14" fill="#10B981"/>
      <text x="24" y="18" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">QUARTER</text>
      <text x="84" y="18" font-size="11" font-weight="600" fill="#605e5c" text-anchor="middle">D · M · Y</text>
    </g>

    <!-- "Q1 2026" tag -->
    <g transform="translate(360, 36)">
      <rect x="0" y="-16" width="50" height="22" rx="11" fill="#10B981"/>
      <text x="25" y="-1" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Q1 2026</text>
    </g>
  </g>

  <!-- KPI 1: Revenue -->
  <g transform="translate(500, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#card)" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#605e5c" letter-spacing="1.5">REVENUE</text>
    <text x="20" y="78" font-size="32" font-weight="800" fill="#252423">$1.24M</text>
    <g transform="translate(20, 96)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#d1fae5"/>
      <text x="25" y="14" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">+12.3%</text>
    </g>
    <text x="20" y="132" font-size="11" fill="#605e5c">vs prior quarter</text>
    <!-- mini sparkline -->
    <g transform="translate(20, 146)" fill="none" stroke="#10B981" stroke-width="2">
      <polyline points="0,18 16,14 32,16 48,8 64,10 80,4 96,6 112,0 128,2 144,-2"/>
    </g>
  </g>

  <!-- KPI 2: Orders -->
  <g transform="translate(700, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#card)" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#605e5c" letter-spacing="1.5">ORDERS</text>
    <text x="20" y="78" font-size="32" font-weight="800" fill="#252423">8,432</text>
    <g transform="translate(20, 96)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#d1fae5"/>
      <text x="25" y="14" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">+8.7%</text>
    </g>
    <text x="20" y="132" font-size="11" fill="#605e5c">in Q1 2026</text>
    <!-- mini bars -->
    <g transform="translate(20, 142)" fill="url(#emeraldFade)">
      <rect x="0" y="14" width="14" height="14"/>
      <rect x="20" y="10" width="14" height="18"/>
      <rect x="40" y="6" width="14" height="22"/>
      <rect x="60" y="12" width="14" height="16"/>
      <rect x="80" y="4" width="14" height="24"/>
      <rect x="100" y="8" width="14" height="20"/>
      <rect x="120" y="0" width="14" height="28"/>
      <rect x="140" y="2" width="14" height="26"/>
    </g>
  </g>

  <!-- KPI 3: New Customers -->
  <g transform="translate(900, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="url(#card)" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#605e5c" letter-spacing="1.5">NEW CUSTOMERS</text>
    <text x="20" y="78" font-size="32" font-weight="800" fill="#252423">547</text>
    <g transform="translate(20, 96)">
      <rect x="0" y="0" width="50" height="20" rx="10" fill="#d1fae5"/>
      <text x="25" y="14" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">+22%</text>
    </g>
    <text x="20" y="132" font-size="11" fill="#605e5c">90-day window</text>
    <!-- mini donut -->
    <g transform="translate(148, 145)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#e5e7eb" stroke-width="5"/>
      <path d="M 0 -20 A 20 20 0 0 1 19 -6" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- KPI 4: AOV -->
  <g transform="translate(1100, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="180" rx="12" fill="url(#card)" stroke="#10B981" stroke-width="1.5"/>
    <text x="60" y="32" font-size="10" font-weight="700" fill="#605e5c" letter-spacing="1" text-anchor="middle">AOV</text>
    <text x="60" y="78" font-size="24" font-weight="800" fill="#252423" text-anchor="middle">$147</text>
    <text x="60" y="100" font-size="11" fill="#605e5c" text-anchor="middle">average</text>
    <text x="60" y="115" font-size="11" fill="#605e5c" text-anchor="middle">order value</text>
    <g transform="translate(60, 145)">
      <rect x="-22" y="0" width="44" height="20" rx="10" fill="#10B981"/>
      <text x="0" y="14" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">+3.1%</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- MIDDLE ROW: Bar chart (left) + Line chart (right) -->
  <!-- ========================================================== -->

  <!-- Bar chart: Sales by month -->
  <g transform="translate(60, 320)" filter="url(#shadow)">
    <rect x="0" y="0" width="580" height="240" rx="12" fill="url(#card)" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#252423">Revenue by Month — Q1 2026</text>
    <text x="20" y="50" font-size="11" fill="#605e5c">Filtered by Calendar Pro date range</text>

    <!-- Axes -->
    <line x1="50" y1="200" x2="560" y2="200" stroke="#d2d0ce" stroke-width="1"/>
    <line x1="50" y1="80" x2="50" y2="200" stroke="#d2d0ce" stroke-width="1"/>

    <!-- Y-axis labels -->
    <g font-size="10" fill="#605e5c" text-anchor="end">
      <text x="44" y="84">$500K</text>
      <text x="44" y="124">$350K</text>
      <text x="44" y="164">$200K</text>
      <text x="44" y="204">$50K</text>
    </g>

    <!-- Bars (Jan, Feb, Mar) — single emerald bars, value above each -->
    <g>
      <!-- Jan -->
      <g transform="translate(110, 0)">
        <rect x="-40" y="118" width="80" height="82" rx="3" fill="url(#emerald)"/>
        <text x="0" y="220" font-size="11" font-weight="600" fill="#252423" text-anchor="middle">Jan</text>
        <text x="0" y="110" font-size="12" font-weight="700" fill="#252423" text-anchor="middle">$380K</text>
      </g>
      <!-- Feb -->
      <g transform="translate(280, 0)">
        <rect x="-40" y="103" width="80" height="97" rx="3" fill="url(#emerald)"/>
        <text x="0" y="220" font-size="11" font-weight="600" fill="#252423" text-anchor="middle">Feb</text>
        <text x="0" y="95" font-size="12" font-weight="700" fill="#252423" text-anchor="middle">$420K</text>
      </g>
      <!-- Mar -->
      <g transform="translate(450, 0)">
        <rect x="-40" y="93" width="80" height="107" rx="3" fill="url(#emerald)"/>
        <text x="0" y="220" font-size="11" font-weight="600" fill="#252423" text-anchor="middle">Mar</text>
        <text x="0" y="85" font-size="12" font-weight="700" fill="#252423" text-anchor="middle">$442K</text>
      </g>
    </g>
  </g>

  <!-- Trend chart: Daily cumulative -->
  <g transform="translate(660, 320)" filter="url(#shadow)">
    <rect x="0" y="0" width="560" height="240" rx="12" fill="url(#card)" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="32" font-size="13" font-weight="700" fill="#252423">Daily Cumulative Revenue</text>
    <text x="20" y="50" font-size="11" fill="#605e5c">90 days · responsive to filter</text>

    <!-- Axes -->
    <line x1="50" y1="200" x2="540" y2="200" stroke="#d2d0ce" stroke-width="1"/>
    <line x1="50" y1="80" x2="50" y2="200" stroke="#d2d0ce" stroke-width="1"/>

    <!-- Y-axis labels -->
    <g font-size="10" fill="#605e5c" text-anchor="end">
      <text x="44" y="84">$1.2M</text>
      <text x="44" y="124">$800K</text>
      <text x="44" y="164">$400K</text>
      <text x="44" y="204">$0</text>
    </g>

    <!-- X-axis labels -->
    <g font-size="11" font-weight="600" fill="#252423" text-anchor="middle">
      <text x="100" y="220">Jan</text>
      <text x="295" y="220">Feb</text>
      <text x="490" y="220">Mar</text>
    </g>

    <!-- Area fill under line -->
    <path d="M 50 200 L 60 195 L 100 184 L 140 174 L 180 162 L 220 152 L 260 139 L 300 124 L 340 112 L 380 100 L 420 92 L 460 86 L 500 82 L 540 80 L 540 200 Z" fill="url(#emeraldFade)"/>

    <!-- Line -->
    <path d="M 50 200 L 60 195 L 100 184 L 140 174 L 180 162 L 220 152 L 260 139 L 300 124 L 340 112 L 380 100 L 420 92 L 460 86 L 500 82 L 540 80" fill="none" stroke="url(#emerald)" stroke-width="3" stroke-linecap="round"/>

    <!-- Data points -->
    <g fill="#ffffff" stroke="#10B981" stroke-width="2.5">
      <circle cx="100" cy="184" r="3.5"/>
      <circle cx="220" cy="152" r="3.5"/>
      <circle cx="340" cy="112" r="3.5"/>
      <circle cx="460" cy="86" r="3.5"/>
      <circle cx="540" cy="80" r="4.5" fill="#10B981" stroke="#059669"/>
    </g>

    <!-- Final value annotation -->
    <g transform="translate(510, 60)">
      <rect x="-22" y="-12" width="46" height="20" rx="10" fill="#10B981"/>
      <text x="1" y="2" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">$1.24M</text>
    </g>
  </g>

  <!-- ========================================================== -->
  <!-- BOTTOM ROW: Feature callouts -->
  <!-- ========================================================== -->
  <g transform="translate(60, 580)" filter="url(#shadow)">
    <rect x="0" y="0" width="1160" height="60" rx="12" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>

    <!-- Pills -->
    <g font-size="12" font-weight="600">
      <g transform="translate(40, 30)">
        <circle cx="0" cy="-1" r="5" fill="#10B981"/>
        <text x="14" y="3" fill="#252423">Cross-Filters</text>
      </g>
      <g transform="translate(180, 30)">
        <circle cx="0" cy="-1" r="5" fill="#10B981"/>
        <text x="14" y="3" fill="#252423">6 Granularities</text>
      </g>
      <g transform="translate(335, 30)">
        <circle cx="0" cy="-1" r="5" fill="#10B981"/>
        <text x="14" y="3" fill="#252423">Smart Defaults</text>
      </g>
      <g transform="translate(490, 30)">
        <circle cx="0" cy="-1" r="5" fill="#10B981"/>
        <text x="14" y="3" fill="#252423">Bookmarks</text>
      </g>
      <g transform="translate(615, 30)">
        <circle cx="0" cy="-1" r="5" fill="#10B981"/>
        <text x="14" y="3" fill="#252423">Light · Dark Theme</text>
      </g>
      <g transform="translate(800, 30)">
        <circle cx="0" cy="-1" r="5" fill="#10B981"/>
        <text x="14" y="3" fill="#252423">5 Locales</text>
      </g>
      <g transform="translate(920, 30)">
        <circle cx="0" cy="-1" r="5" fill="#10B981"/>
        <text x="14" y="3" fill="#252423">Accessibility-Ready</text>
      </g>
    </g>
  </g>

  <!-- Bottom strip / brand bar -->
  <g transform="translate(0, 660)">
    <rect x="0" y="0" width="1280" height="60" fill="#252423"/>
    <text x="60" y="38" font-size="15" font-weight="500" fill="#ffffff">Calendar Pro</text>
    <text x="180" y="38" font-size="13" font-weight="400" fill="#a19f9d">© 2026 Chuck Nemeth · MIT License</text>
    <text x="1220" y="38" font-size="13" font-weight="500" fill="#10B981" text-anchor="end">Microsoft AppSource</text>
  </g>
</svg>
